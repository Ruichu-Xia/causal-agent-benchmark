[project]
name = "causal-reasoning"
version = "0.1.0"
description = "Text causal reasoning over random causal worlds: d-separation, adjustment, effects and discovery, with exact answers."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "verifiers==0.4.0",
    "causalagentbench",
]

[tool.uv.sources]
causalagentbench = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["causal_reasoning"]
