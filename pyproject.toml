[project]
name = "causalagentbench"
version = "0.3.0"
description = "An RL environment where an LLM agent answers causal questions by analyzing data in a Python sandbox."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "data/README.md"]
authors = [{ name = "CausalAgentBench" }]
keywords = ["causal-inference", "benchmark", "rl-environment", "agents", "evaluation"]
# The sandbox gives the agent pandas, scipy and statsmodels, and the PC helper uses causal-learn.
dependencies = [
    "numpy>=2.1",
    "networkx>=3.3",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "causal-learn>=0.1.4.8",
]

[project.urls]
Homepage = "https://github.com/Ruichu-Xia/causal-agent-benchmark"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causalagentbench"]

# --- dev tooling (uv dependency group) ----------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

# --- ruff (lint + format) ------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["causalds"]  # vendored reference repo (research only, not our package)

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "D",         # pydocstyle
    "ANN",       # flake8-annotations
    "NPY",       # numpy-specific
]
ignore = [
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__
    "ANN401", # allow typing.Any where deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104", "ANN"]  # tests need no docstrings / annotations

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["causalagentbench"]

# --- mypy (strict) -------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["networkx.*", "causallearn.*"]
ignore_missing_imports = true

# --- pytest --------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
