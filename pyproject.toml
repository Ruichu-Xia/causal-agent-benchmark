[project]
name = "causalagentbench"
version = "0.0.0"
description = "CausalAgentBench — a verifiable causal-reasoning benchmark and RL environment for tool-using agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "CausalAgentBench" }]
keywords = ["causal-inference", "benchmark", "rl-environment", "agents", "evaluation"]
dependencies = [
    "numpy>=2.1",
    "networkx>=3.3",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# The default LLM path (LiteLLM): naming generation (causalagentbench.generation) and the real
# tool-calling agent client (causalagentbench.agent.clients.LiteLLMClient). Never needed to build or
# score an instance with the always-available abstract labeler.
generation = ["litellm>=1.50", "python-dotenv>=1.0", "tenacity>=8.0"]

# Only for causalagentbench.agent.clients.DatabricksClient - comparing the agent against a model served
# behind a Databricks AI Gateway. Not part of the default path; most users only need `generation`.
databricks = ["openai>=1.50", "python-dotenv>=1.0"]
discovery = [
    "causal-learn>=0.1.4.8",
]

[project.urls]
Homepage = "https://github.com/causal-agent-benchmark/causalagentbench"

[project.scripts]
causalagentbench-smoke = "causalagentbench.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causalagentbench"]

# --- dev tooling (uv dependency group) ----------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

# --- ruff (lint + format) ------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["causalds"]  # vendored reference repo (research only, not our package)

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "D",         # pydocstyle
    "ANN",       # flake8-annotations
    "NPY",       # numpy-specific
]
ignore = [
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__
    "ANN401", # allow typing.Any where deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104", "ANN"]  # tests need no docstrings / annotations
"src/causalagentbench/smoke.py" = ["T201"]     # smoke script prints

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["causalagentbench"]

# --- mypy (strict) -------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "litellm.*", "dotenv.*", "yaml.*", "causallearn.*"]
ignore_missing_imports = true

# --- pytest --------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
